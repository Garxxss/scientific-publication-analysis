<text x="40" y="1040" fill="#4f606f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Действия исследователя и администратора требуют входа. Исследователь работает со своими проектами.</text>
<text x="40" y="1073" fill="#4f606f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Администрирование в первой версии допускается через конфигурацию и API. Линии обозначают участие актора.</text>
